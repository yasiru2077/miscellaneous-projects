services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: task-client
    image: task-client:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.product.name=task-client"
      - "com.project.env=production"
    networks:
      - task-network

networks:
  task-network:
    driver: bridge
    name: task-network
